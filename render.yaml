services:
  - type: web
    name: multiagentabl-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/bootstrap.py && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: multiagentabl-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ABL_DB_DIR
        value: /var/data
      - key: ABL_UPLOAD_DIR
        value: /var/data/uploads
      - key: ABL_CHROMA_DIR
        value: /var/data/chroma
      - key: CORS_ORIGINS
        value: "*"
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: multiagentabl-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && node scripts/write-runtime-config.mjs && npm run build
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: multiagentabl-api
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
